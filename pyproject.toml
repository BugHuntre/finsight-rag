[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsight-rag"
version = "0.1.0"
description = "Question-answering assistant for Indian company financial reports (RAG)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf",
    "langchain-text-splitters",
    "sentence-transformers",
    "chromadb",
    "pyyaml",
    "python-dotenv",
    "litellm",
    "fastapi",
    "uvicorn[standard]",
    "streamlit",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "eval"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
