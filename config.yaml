# Central configuration (FR8). Any key can be overridden by an env var
# named FINSIGHT_<KEY_IN_UPPERCASE>, e.g. FINSIGHT_CHUNK_SIZE=400.

paths:
  raw_dir: data/raw
  index_dir: data/index

ingest:
  chunk_size: 800
  chunk_overlap: 150
  # A line is treated as a running header/footer if it appears on at least
  # this fraction of pages.
  header_footer_min_ratio: 0.4
  embed_batch_size: 64
  # Chunks shorter than this after cleaning are dropped (cover pages, captions, etc).
  min_chunk_chars: 40

retrieval:
  top_k: 8
  collection: finsight
  # Cosine distance cutoff (bge-small): chunks farther than this from the question
  # are dropped before the LLM ever sees them, so an out-of-scope question (e.g.
  # "what's the capital of France?") triggers the not-found path deterministically
  # instead of relying on the LLM to notice the context is irrelevant and refuse -
  # a real failure observed with qwen2.5:3b during testing (it hallucinated an
  # answer with fake citations rather than refusing). Calibrated from measured
  # distances: real finance questions on this corpus scored 0.20-0.26, unrelated
  # questions scored 0.38-0.53 - re-tune against the golden set in Phase 5 (G5).
  max_distance: 0.32

models:
  embedding_model: BAAI/bge-small-en-v1.5
  # ollama/<model> for local dev, e.g. groq/llama-3.1-8b-instant for the deployed
  # demo (Ollama can't run on the free hosting tier). qwen2.5:3b fits a 4GB GPU.
  llm_model: ollama/qwen2.5:3b

api:
  # Off by default - the spec calls for the public demo to disable this endpoint,
  # since anyone could otherwise trigger a full re-ingestion over the network.
  enable_ingest_endpoint: false

# Filename -> ticker lookup used for chunk metadata. Add companies here.
tickers:
  TCS: TCS
  Infosys: INFY
  HDFC Bank: HDFCBANK
  ICICI Bank: ICICIBANK
  Reliance Industries: RELIANCE
  Asian Paints: ASIANPAINT
  Maruti Suzuki: MARUTI
  ITC: ITC
  Sun Pharma: SUNPHARMA
  Larsen and Toubro: LT
